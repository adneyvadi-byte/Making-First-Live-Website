<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Management System</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📋 Attendance Management System</h1>

<p>Create a student list and take attendance.</p>

<div class="box">

<label><b>Lecture Date</b></label><br>

<input
type="date"
id="lectureDate">

<br><br>

<label><b>Class Name</b></label><br>

<input
type="text"
id="className"
placeholder="Enter Class Name">

<br><br>

<label><b>Subject</b></label><br>

<input
type="text"
id="subject"
placeholder="Enter Subject">

<br><br>

<label><b>Number of Students</b></label><br>

<input
type="number"
id="studentCount"
placeholder="Enter Number of Students">

<br><br>

<button onclick="createList()">
Create Student List
</button>

</div>

<hr>

<div id="studentList"></div>

<br>

<button onclick="saveAttendance()">
💾 Save Attendance
</button>

<button onclick="exportToExcel()">
📥 Export Attendance to Excel
</button>

<button onclick="viewAttendance()">
📋 View Saved Attendance
</button>

<button onclick="clearData()">
🗑 Clear All Data
</button>

<br><br>

<h2>Attendance Summary</h2>

<p>Total Lectures : <span id="totalLectures">1</span></p>

<p>
✅ Present :
<span id="presentCount">0</span>
</p>

<p>
❌ Absent :
<span id="absentCount">0</span>
</p>

<br>

<div id="history"></div>

<br>

<a href="../index.html">
⬅ Back to Portfolio
</a>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="script.js"></script>

</body>

</html>
